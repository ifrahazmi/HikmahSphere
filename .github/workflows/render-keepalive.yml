name: Keep Render Backend Awake

on:
  schedule:
    # Render Free services sleep after 15 minutes without inbound traffic.
    # Offset from the top of the hour to reduce GitHub Actions cron congestion.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-backend-keepalive
  # Never cancel a slow cold-start request when the next scheduled run queues.
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Render health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify backend health
        env:
          HEALTH_URL: https://hikmahsphere-backend.onrender.com/health/keepalive
        run: |
          started_at="$(date +%s)"
          response="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 10 \
              --connect-timeout 20 \
              --max-time 180 \
              "$HEALTH_URL"
          )"

          echo "$response" | jq -e '
            .status == "success"
            and .keepalive == true
            and (.timestamp | type == "string")
          ' > /dev/null

          elapsed="$(( $(date +%s) - started_at ))"
          uptime="$(echo "$response" | jq -r '.uptimeSeconds')"
          database="$(echo "$response" | jq -r '.services.database')"
          echo "Render keepalive succeeded in ${elapsed}s (process uptime: ${uptime}s, database: ${database})."
